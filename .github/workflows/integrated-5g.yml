name: Integrated hybrid and independent KIE stress validation
on:
  push:
    branches: ['codex/live-5g-validation-20261107']
    paths: ['experiments/integrated_5g/**', '.github/workflows/integrated-5g.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        seed: [10101, 10201, 10301]
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/live_5g/requirements.txt
      - run: python -m pytest experiments/live_5g experiments/integrated_5g -q
      - uses: actions/cache@v4
        id: cache
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash experiments/live_5g/setup_open5gs.sh build
      - run: bash experiments/live_5g/setup_open5gs.sh runtime
      - name: Record sources
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
          python -m pip freeze > evidence/python_packages.txt
      - name: Normal training with churn and control outages
        run: python -m experiments.integrated_5g.collect --phase train --seed ${{ matrix.seed }} --out evidence/train --windows 160 --actors 8
      - name: Independent normal calibration
        run: python -m experiments.integrated_5g.collect --phase cal --seed $(( ${{ matrix.seed }} + 10 )) --out evidence/cal --windows 200 --actors 8
      - name: Freeze models before testing
        run: python -m experiments.live_5g.evaluate fit --train evidence/train --cal evidence/cal --out evidence/frozen --seed ${{ matrix.seed }}
      - name: Twenty minute held-out stress test
        run: python -m experiments.integrated_5g.collect --phase test --seed $(( ${{ matrix.seed }} + 20 )) --out evidence/test --windows 1200 --actors 8 --frozen evidence/frozen
      - name: Independent replay and three-state metrics
        run: python experiments/integrated_5g/audit.py evidence
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p evidence
          sudo journalctl --no-pager -u 'open5gs-*' > evidence/services.log
          systemctl list-units --all --no-pager --full --type=service 'open5gs-*' > evidence/service_status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-5g-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
