name: Final V5 seed 90404 technical retry

on:
  push:
    branches: ['experiment/final-v5-confirmation-20261113']
    paths:
      - '.github/triggers/final-v5-90404-retry'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retry-90404:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca53868b7c5bc0c5ed83a9c8ca86b7e34abddd94
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact frozen final commit
        run: |
          test "$(git rev-parse HEAD)" = "ca53868b7c5bc0c5ed83a9c8ca86b7e34abddd94"
          cat .github/preregistrations/final-v5-confirmation-20261113.txt

      - name: Install experiment stack
        env:
          NO_LONG_DOUBLE: '1'
        run: python -m pip install -r experiments/live_5g/requirements.txt

      - name: Retrieve hash-pinned non-ML inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/verge88/signal_network_sim/actions/artifacts/13785795564/zip > measured.zip
          gh api repos/verge88/signal_network_sim/actions/artifacts/13836367435/zip > zonal.zip
          echo 'c76c4ed6a865dc5c37803dbc46e6cd05c62ebe803f398fe409dd2f1090910129  measured.zip' | sha256sum -c
          echo '8aa7e697e674b68b22e9cf7980e653a93f0060ad6469101f651c4c67a6607f0b  zonal.zip' | sha256sum -c
          unzip -q measured.zip 'frozen/model.joblib' 'frozen/manifest.json' 'frozen/accumulation.json' 'frozen/extensions.json' 'frozen/refinement.json'
          unzip -q zonal.zip zone_models.json

      - name: Retrieve frozen V4-core development and calibration references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical development
          for spec in             "89901:13967200654" "89902:13966557271" "89903:13966467216"             "90001:13977466681" "90002:13976814586" "90003:13977925621"             "90101:13985819940" "90102:13989515036" "90103:13988990036"; do
            seed="${spec%%:*}"; artifact="${spec##*:}"
            mkdir -p "historical/${seed}" "development/${seed}"
            gh api "repos/verge88/signal_network_sim/actions/artifacts/${artifact}/zip" > "historical/${seed}/artifact.zip"
            unzip -q "historical/${seed}/artifact.zip" -d "historical/${seed}"
            unzip -q "historical/${seed}/full-evidence.zip"               'test/features.csv' 'test/labels.csv'               'cal/features.csv' 'cal/labels.csv'               -d "development/${seed}"
          done

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash experiments/live_5g/setup_open5gs.sh build
      - run: bash experiments/live_5g/setup_open5gs.sh runtime

      - name: Collect fresh normal train and calibration
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
          cp zone_models.json evidence/zone_models.json
          python -m experiments.live_5g.collect --phase train --seed 91404             --out evidence/train --windows 600 --actors 32
          python -m experiments.live_5g.collect --phase cal --seed 92404             --out evidence/cal --windows 600 --actors 32

      - name: Fit frozen V5
        run: |
          python -m experiments.distributed_5g.full_experiment prepare evidence             --previous frozen --seed 90404 --detector temporal_graph_v5             --development               development/89901/test development/89902/test development/89903/test               development/90001/test development/90002/test development/90003/test               development/90101/test development/90102/test development/90103/test             --reference-calibration               development/89901/cal development/89902/cal development/89903/cal               development/90001/cal development/90002/cal development/90003/cal               development/90101/cal development/90102/cal development/90103/cal             --v4-cluster-order 2 --v4-decay 0.75 --v4-alpha 0.00015             --v4-accumulator-multiplier 1.50

      - name: Run fresh held-out schedule
        run: |
          bash experiments/distributed_5g/namespace_smoke.sh             --seed 90404 --out evidence/test --frozen evidence/frozen             --zone-models evidence/zone_models.json --include-if-context --confirm-if-context             --ml-method TG_V5 --ml-confirmation-mode direct             --accumulator-multiplier 1.50 --recover-normal

      - name: Audit prospective evidence
        run: python -m experiments.distributed_5g.full_experiment audit evidence

      - name: Collect reproducibility evidence
        if: always()
        run: |
          mkdir -p evidence/summary
          cp evidence/source_commit.txt evidence/summary/ || true
          cp .github/preregistrations/final-v5-confirmation-20261113.txt evidence/summary/preregistration.txt || true
          cp evidence/frozen/manifest.json evidence/summary/model_manifest.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-graph-v5-final-retry-summary-90404-${{ github.run_id }}
          path: evidence/summary/
          retention-days: 60
