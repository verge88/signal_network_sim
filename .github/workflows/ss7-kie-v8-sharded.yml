name: SS7 KIE V8 sharded reproducibility pilot
on:
  workflow_dispatch:
  push:
    branches:
      - codex/ss7-kie-hierarchical-multiclass
    paths:
      - 'ss7/hierarchical_kie_v8_sharded.py'
      - 'tests/test_ss7_kie_v8_sharded.py'
      - '.github/workflows/ss7-kie-v8-sharded.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: timeout 7m python -m ss7.hierarchical_kie_v8_sharded --stage generate --seed 216101 --shard ${{ matrix.shard }} --out worlds
      - uses: actions/upload-artifact@v4
        with:
          name: v8-worlds-${{ matrix.shard }}
          path: worlds/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  evaluate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: python -m unittest discover -s tests -p 'test_ss7_hierarchical_kie*.py' -v
      - run: python -m unittest discover -s tests -p 'test_ss7_queue_stability.py' -v
      - run: python -m unittest discover -s tests -p 'test_ss7_kie_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: v8-worlds-*
          path: worlds
          merge-multiple: true
      - run: timeout 6m python -m ss7.hierarchical_kie_v8_sharded --stage evaluate --seed 216101 --input worlds --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss7-kie-v8-216101-sharded
          path: results/
          if-no-files-found: warn
