name: 5g-sba-v9-provenance-corrected-confirmatory

on:
  push:
    branches:
      - experiment/sba-v9-provenance-corrected-20261009
    paths:
      - ".github/workflows/5g-sba-v9-provenance-confirmatory.yml"
      - "5g/**"
      - "tests/test_sba_semantic_v9_provenance.py"
      - "experiments/5g_sba_v9_provenance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-tests:
    name: Verify generator provenance and v8/v9 statistics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Check provenance and existing v8/v9 regression suites
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_sba_semantic_v9_provenance.py" -v
          python -m unittest discover -s tests -p "test_sba_semantic_v8.py" -v
          python -m unittest discover -s tests -p "test_sba_semantic_v9_*.py" -v

  corrected-confirmatory:
    name: Run fixed-generator holdout 62-71
    needs: provenance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Run ten paired seeds under the frozen analysis plan
        run: |
          set -o pipefail
          python 5g/run_semantic_v9_confirmatory.py \
            --seeds 62 63 64 65 66 67 68 69 70 71 \
            --calib-windows 1200 \
            --eval-windows 200 \
            --operational-windows 200 \
            --state-attack-windows 100 \
            --hidden 5 \
            --target-fpr 0.01 \
            --bootstrap 5000 \
            --permutations 10000 \
            --out-dir runs/sba_semantic_v9/provenance_corrected_62_71 \
            2>&1 | tee experiment.log
      - name: Publish complete experimental outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sba-v9-provenance-corrected-62-71
          path: |
            runs/sba_semantic_v9/provenance_corrected_62_71/
            experiment.log
          if-no-files-found: warn
          retention-days: 30
