name: Separate calibration and persistent trends on Open5GS
on:
  push:
    branches: ['codex/live-5g-validation-20261107']
    paths: ['experiments/calibrated_5g/**', '.github/workflows/calibrated-5g.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        seed: [31101,31201,31301]
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/live_5g/requirements.txt
      - run: python -m pytest experiments/live_5g experiments/integrated_5g experiments/resilient_5g experiments/calibrated_5g -q
      - uses: actions/cache@v4
        id: cache
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash experiments/live_5g/setup_open5gs.sh build
      - run: bash experiments/live_5g/setup_open5gs.sh runtime
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
      - name: Normal training including authorized ramps
        run: python -m experiments.calibrated_5g.collect --phase train --seed ${{ matrix.seed }} --out evidence/train --windows 600 --actors 8
      - name: Independent normal calibration
        run: python -m experiments.calibrated_5g.collect --phase cal --seed $(( ${{ matrix.seed }} + 10 )) --out evidence/cal --windows 600 --actors 8
      - name: Freeze hybrid and extension thresholds before testing
        run: |
          python -m experiments.live_5g.evaluate fit --train evidence/train --cal evidence/cal --out evidence/frozen --seed ${{ matrix.seed }}
          python -m experiments.resilient_5g.detector evidence
          python -m experiments.calibrated_5g.detector evidence
      - name: Twenty minute held-out confirmation
        run: python -m experiments.calibrated_5g.collect --phase test --seed $(( ${{ matrix.seed }} + 20 )) --out evidence/test --windows 1200 --actors 8 --frozen evidence/frozen
      - name: Independent replay with separate security and availability metrics
        run: python -m experiments.calibrated_5g.audit evidence
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p evidence
          sudo journalctl --no-pager -u 'open5gs-*' > evidence/services.log
          systemctl list-units --all --no-pager --full --type=service 'open5gs-*' > evidence/service_status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrated-5g-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
