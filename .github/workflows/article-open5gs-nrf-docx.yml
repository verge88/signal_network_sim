name: Build 5G NRF scientific article DOCX

on:
  push:
    branches:
      - article/5g-nrf-kie-manuscript-20261009
    paths:
      - article_open5gs_nrf/manuscript.md
      - article_open5gs_nrf/scripts/**
      - article_open5gs_nrf/diagrams/**
      - .github/workflows/article-open5gs-nrf-docx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install python-docx matplotlib
      - name: Render scientific manuscript and Mermaid-equivalent diagrams
        run: |
          python article_open5gs_nrf/scripts/build.py
      - name: Commit generated DOCX to the isolated article branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article_open5gs_nrf/5g_nrf_kie_article_draft.docx
          if ! git diff --cached --quiet; then
            git commit -m "docs: render 5G NRF scientific manuscript DOCX"
            git push origin HEAD:article/5g-nrf-kie-manuscript-20261009
          fi
      - name: Publish downloadable Word manuscript and Mermaid sources
        uses: actions/upload-artifact@v4
        with:
          name: 5g-nrf-kie-scientific-article-docx
          path: |
            article_open5gs_nrf/5g_nrf_kie_article_draft.docx
            article_open5gs_nrf/diagrams/*.mmd
          if-no-files-found: error
          retention-days: 30
