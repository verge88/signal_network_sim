name: SS7 hierarchical KIE V2 independent worlds
on:
  workflow_dispatch:
  push:
    branches:
      - codex/ss7-kie-hierarchical-multiclass
    paths:
      - 'ss7/hierarchical_kie_v2.py'
      - 'tests/test_ss7_hierarchical_kie_v2.py'
      - '.github/workflows/ss7-hierarchical-kie-v2.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [16101, 36101, 56101]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: python -m unittest discover -s tests -p 'test_ss7_hierarchical_kie*.py' -v
      - run: python -m ss7.hierarchical_kie_v2 --seed ${{ matrix.seed }} --days 0.4 --repetitions 3 --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss7-kie-v2-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
