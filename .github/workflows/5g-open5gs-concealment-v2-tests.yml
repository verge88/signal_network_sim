name: 5g-open5gs-concealment-v2-tests

on:
  push:
    branches:
      - "experiment/5g-kie-full"
    paths:
      - "experiments/5g_kie_full/run_open5gs_concealment_v2.py"
      - "experiments/5g_kie_full/aggregate_open5gs_concealment_v2.py"
      - "experiments/5g_kie_full/tests/test_open5gs_concealment_v2.py"
      - "experiments/5g_kie_full/tests/test_open5gs_concealment_v2_aggregate.py"
      - ".github/workflows/5g-open5gs-concealment-v2-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pytest numpy pandas
      - run: |
          python -m pytest -q \
            experiments/5g_kie_full/tests/test_open5gs_concealment_v2.py \
            experiments/5g_kie_full/tests/test_open5gs_concealment_v2_aggregate.py
