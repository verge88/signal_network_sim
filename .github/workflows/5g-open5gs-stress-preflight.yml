name: 5g-open5gs-stress-preflight

on:
  push:
    branches: ["experiment/5g-kie-full"]
    paths:
      - "experiments/5g_kie_full/run_open5gs_stress.py"
      - "experiments/5g_kie_full/nrf_background_load.py"
      - "experiments/5g_kie_full/aggregate_open5gs_stress.py"
      - "experiments/5g_kie_full/tests/test_open5gs_stress.py"
      - ".github/workflows/5g-open5gs-stress-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -r experiments/5g_kie_full/requirements.txt pytest
      - name: Stress protocol and v1/v2 regression tests
        run: |
          python -m pytest -q \
            experiments/5g_kie_full/tests/test_open5gs_stress.py \
            experiments/5g_kie_full/tests/test_open5gs_randomized_scenarios.py \
            experiments/5g_kie_full/tests/test_open5gs_concealment_v2.py \
            experiments/5g_kie_full/tests/test_open5gs_concealment_v2_aggregate.py \
            experiments/5g_kie_full/tests/test_open5gs_event_boundary_audit.py
