name: 5g-open5gs-kie-sidecar

on:
  push:
    branches:
      - "experiment/5g-kie-full"
    paths:
      - "experiments/5g_kie_full/open5gs_kie_sidecar.py"
      - "experiments/5g_kie_full/run_open5gs_kie_analysis.py"
      - "experiments/5g_kie_full/tests/test_open5gs_kie.py"
      - "experiments/5g_kie_full/OPEN5GS_KIE_ITERATION.md"
      - ".github/workflows/5g-open5gs-kie-sidecar.yml"
  workflow_dispatch:

jobs:
  open5gs-kie:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      MPLBACKEND: Agg

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install -r experiments/5g_kie_full/requirements.txt pyyaml

      - name: Run KIE tests
        run: |
          python -m pytest -q             experiments/5g_kie_full/tests/test_open5gs_probe.py             experiments/5g_kie_full/tests/test_open5gs_real_features.py             experiments/5g_kie_full/tests/test_open5gs_kie.py

      - name: Install Open5GS and capture tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             software-properties-common ca-certificates curl jq tcpdump tshark python3-yaml
          sudo add-apt-repository -y ppa:open5gs/latest
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y open5gs

      - name: Start Open5GS, packet capture and signed KIE sidecar
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          mkdir -p "$OUT"
          export OPEN5GS_KIE_SECRET="$(openssl rand -hex 32)"
          echo "OPEN5GS_KIE_SECRET=$OPEN5GS_KIE_SECRET" >> "$GITHUB_ENV"

          dpkg-query -W -f='${Package} ${Version}\n' 'open5gs*' > "$OUT/open5gs_packages.txt" || true

          services=(
            open5gs-nrfd.service open5gs-scpd.service open5gs-udrd.service
            open5gs-udmd.service open5gs-ausfd.service open5gs-pcfd.service
            open5gs-nssfd.service open5gs-smfd.service open5gs-amfd.service
          )
          for unit in "${services[@]}"; do
            if systemctl list-unit-files --type=service --no-legend "$unit" | grep -q "$unit"; then
              sudo systemctl restart "$unit"
            fi
          done
          sleep 30

          sudo tcpdump -i lo -U -s 0 -w "$OUT/open5gs_sbi_kie.pcap" 'tcp port 7777'             > "$OUT/tcpdump.log" 2>&1 &
          echo $! > "$OUT/tcpdump.pid"

          cat > "$OUT/kie_control.json" <<'JSON'
          {"phase":"baseline","mask_nfs":[]}
          JSON

          sudo -E nohup python experiments/5g_kie_full/open5gs_kie_sidecar.py             --reports "$OUT/kie_reports.jsonl"             --ground-truth "$OUT/kie_ground_truth.jsonl"             --control-file "$OUT/kie_control.json"             --interval-s 2             > "$OUT/kie_sidecar.log" 2>&1 &
          echo $! > "$OUT/kie_sidecar.pid"
          sleep 6

      - name: Probe live SBI endpoints
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          python experiments/5g_kie_full/open5gs_probe.py             --config-dir /etc/open5gs             --output "$OUT/open5gs_endpoints.json"
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("experiments/5g_kie_full/results_open5gs_kie/open5gs_endpoints.json").read_text())
          if not any(r["nf"].lower()=="nrf" and r["reachable"] for r in doc["endpoints"]):
              raise SystemExit("NRF unreachable")
          if doc["reachable_count"] < 6:
              raise SystemExit(f"only {doc['reachable_count']} endpoints reachable")
          PY

      - name: Run baseline and truthful/hidden report scenarios
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          echo "start_ts,end_ts,phase,cycle" > "$OUT/phase_intervals.csv"
          now_ts() { python -c 'import time; print(f"{time.time():.6f}")'; }
          control() {
            local phase="$1"; local mask="$2"
            printf '{"phase":"%s","mask_nfs":%s}\n' "$phase" "$mask" > "$OUT/kie_control.json"
          }

          read NRF_ADDR NRF_PORT < <(
            python - <<'PY'
          import json
          doc=json.load(open("experiments/5g_kie_full/results_open5gs_kie/open5gs_endpoints.json"))
          for r in doc["endpoints"]:
              if r["nf"].lower()=="nrf" and r["reachable"]:
                  print(r["address"], r["port"]); break
          PY
          )

          control baseline '[]'
          S="$(now_ts)"; sleep 900; E="$(now_ts)"
          echo "$S,$E,baseline,0" >> "$OUT/phase_intervals.csv"

          for cycle in 1 2 3 4; do
            control truthful_udm_restart '[]'
            S="$(now_ts)"; sudo systemctl restart open5gs-udmd.service; sleep 10; E="$(now_ts)"
            echo "$S,$E,truthful_udm_restart,$cycle" >> "$OUT/phase_intervals.csv"

            control washout '[]'
            S="$(now_ts)"; sleep 20; E="$(now_ts)"
            echo "$S,$E,washout,$cycle" >> "$OUT/phase_intervals.csv"
            S="$(now_ts)"; sleep 15; E="$(now_ts)"
            echo "$S,$E,stable_recovery,$cycle" >> "$OUT/phase_intervals.csv"

            control hidden_udm_restart '["udm"]'
            sleep 3
            S="$(now_ts)"; sudo systemctl restart open5gs-udmd.service; sleep 10; E="$(now_ts)"
            echo "$S,$E,hidden_udm_restart,$cycle" >> "$OUT/phase_intervals.csv"
            control washout '[]'
            S="$(now_ts)"; sleep 20; E="$(now_ts)"
            echo "$S,$E,washout,$cycle" >> "$OUT/phase_intervals.csv"
            S="$(now_ts)"; sleep 15; E="$(now_ts)"
            echo "$S,$E,stable_recovery,$cycle" >> "$OUT/phase_intervals.csv"

            control truthful_nrf_burst '[]'
            S="$(now_ts)"
            for i in $(seq 1 60); do
              curl --http2-prior-knowledge -sS -o /dev/null                 "http://$NRF_ADDR:$NRF_PORT/nnrf-nfm/v1/nf-instances" || true
              sleep 0.03
            done
            sleep 3; E="$(now_ts)"
            echo "$S,$E,truthful_nrf_burst,$cycle" >> "$OUT/phase_intervals.csv"

            control washout '[]'
            S="$(now_ts)"; sleep 20; E="$(now_ts)"
            echo "$S,$E,washout,$cycle" >> "$OUT/phase_intervals.csv"
            S="$(now_ts)"; sleep 15; E="$(now_ts)"
            echo "$S,$E,stable_recovery,$cycle" >> "$OUT/phase_intervals.csv"

            control hidden_nrf_burst '["nrf"]'
            sleep 3
            S="$(now_ts)"
            for i in $(seq 1 60); do
              curl --http2-prior-knowledge -sS -o /dev/null                 "http://$NRF_ADDR:$NRF_PORT/nnrf-nfm/v1/nf-instances" || true
              sleep 0.03
            done
            sleep 3; E="$(now_ts)"
            echo "$S,$E,hidden_nrf_burst,$cycle" >> "$OUT/phase_intervals.csv"
            control washout '[]'
            S="$(now_ts)"; sleep 20; E="$(now_ts)"
            echo "$S,$E,washout,$cycle" >> "$OUT/phase_intervals.csv"
            S="$(now_ts)"; sleep 15; E="$(now_ts)"
            echo "$S,$E,stable_recovery,$cycle" >> "$OUT/phase_intervals.csv"
          done
          control complete '[]'

      - name: Stop collectors and export HTTP2 events
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          if [ -f "$OUT/kie_sidecar.pid" ]; then
            sudo kill "$(cat "$OUT/kie_sidecar.pid")" 2>/dev/null || true
          fi
          if [ -f "$OUT/tcpdump.pid" ]; then
            sudo kill -INT "$(cat "$OUT/tcpdump.pid")" 2>/dev/null || true
            sleep 3
          fi
          sudo chown -R "$(id -u):$(id -g)" "$OUT" || true

          test -s "$OUT/open5gs_sbi_kie.pcap"
          test -s "$OUT/kie_reports.jsonl"
          test -s "$OUT/kie_ground_truth.jsonl"

          tshark -r "$OUT/open5gs_sbi_kie.pcap"             -d tcp.port==7777,http2             -Y 'http2 || tcp.flags.reset == 1'             -T fields -E header=y -E separator=/t -E occurrence=a -E aggregator=,             -e frame.time_epoch -e ip.src -e ip.dst -e tcp.stream             -e tcp.flags.reset -e tcp.len -e http2.streamid -e http2.type             -e http2.header.name -e http2.header.value             > "$OUT/sbi_http2_events.tsv"

      - name: Build real SBI features
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          python experiments/5g_kie_full/open5gs_real_features.py             --events "$OUT/sbi_http2_events.tsv"             --endpoints "$OUT/open5gs_endpoints.json"             --intervals "$OUT/phase_intervals.csv"             --output-dir "$OUT" --window-s 2

      - name: Compare passive SBI and signed KIE
        shell: bash
        run: |
          set -euxo pipefail
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          python experiments/5g_kie_full/run_open5gs_kie_analysis.py             --global-features "$OUT/real_sbi_global_features.csv"             --per-nf-features "$OUT/real_sbi_per_nf_features.csv"             --reports "$OUT/kie_reports.jsonl"             --ground-truth "$OUT/kie_ground_truth.jsonl"             --output-dir "$OUT"

          echo "=== phase metrics ==="
          cat "$OUT/kie_phase_metrics.csv"
          echo "=== cycle metrics ==="
          cat "$OUT/kie_cycle_metrics.csv"
          echo "=== report validation ==="
          cat "$OUT/kie_report_validation.json"

      - name: Collect Open5GS diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          OUT="experiments/5g_kie_full/results_open5gs_kie"
          sudo journalctl --no-pager --since "-45 minutes"             -u open5gs-nrfd.service -u open5gs-udmd.service -u open5gs-scpd.service             > "$OUT/open5gs_journal.txt" 2>&1 || true
          systemctl --no-pager --full --type=service 'open5gs-*'             > "$OUT/open5gs_service_status.txt" 2>&1 || true

      - name: Upload real Open5GS KIE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5g-open5gs-kie-results
          path: experiments/5g_kie_full/results_open5gs_kie/
          retention-days: 30
          if-no-files-found: warn
