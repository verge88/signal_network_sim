name: V5 ablation and structural generalization

on:
  push:
    branches: ['experiment/v5-ablation-generalization-20261114']
    paths:
      - '.github/triggers/v5-ablation-generalization'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify preregistration is present
        run: |
          cat .github/preregistrations/v5-ablation-generalization-20261114.txt
          test -f experiments/distributed_5g/v5_ablation_generalization.py

      - name: Install experiment stack
        env:
          NO_LONG_DOUBLE: '1'
        run: python -m pip install -r experiments/live_5g/requirements.txt

      - name: Retrieve eight complete frozen final evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          for spec in \
            "90401:14049128601" \
            "90402:14049887852" \
            "90405:14050881142" \
            "90406:14048993238" \
            "90407:14049407530" \
            "90408:14048857700" \
            "90409:14049716184" \
            "90410:14049337789"; do
            seed="${spec%%:*}"
            artifact="${spec##*:}"
            work="/tmp/v5-${seed}"
            rm -rf "$work"
            mkdir -p "$work" "inputs/${seed}"
            gh api "repos/verge88/signal_network_sim/actions/artifacts/${artifact}/zip" > "$work/artifact.zip"
            unzip -q "$work/artifact.zip" -d "$work/artifact"
            nested="$(find "$work/artifact" -name full-evidence.zip -print -quit)"
            test -n "$nested"
            unzip -q "$nested" \
              'frozen/model.joblib' \
              'frozen/manifest.json' \
              'cal/features.csv' \
              'cal/labels.csv' \
              'test/features.csv' \
              'test/labels.csv' \
              'test/online_predictions.csv' \
              'test/distributed_predictions.jsonl' \
              -d "inputs/${seed}"
            test -f "inputs/${seed}/frozen/model.joblib"
            test -f "inputs/${seed}/test/distributed_predictions.jsonl"
            rm -rf "$work"
          done

      - name: Run frozen V5 ablation and structural stress test
        run: |
          python -m experiments.distributed_5g.v5_ablation_generalization \
            --root inputs --output v5-diagnostic

      - name: Show scientific summary
        if: always()
        run: |
          if test -f v5-diagnostic/REPORT.md; then cat v5-diagnostic/REPORT.md; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-ablation-generalization-${{ github.run_id }}
          path: v5-diagnostic/
          retention-days: 90
