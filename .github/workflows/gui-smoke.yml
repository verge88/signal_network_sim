name: GUI smoke tests

on:
  push:
    paths:
      - "gui/**"
      - "tests/test_gui_studio.py"
      - ".github/workflows/gui-smoke.yml"
  pull_request:
    paths:
      - "gui/**"
      - "tests/test_gui_studio.py"
      - ".github/workflows/gui-smoke.yml"

jobs:
  gui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install virtual display and Tk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk

      - name: Check Python syntax
        run: python3 -m compileall -q gui tests/test_gui_studio.py

      - name: Exercise editor using a virtual display
        run: xvfb-run -a python3 -m unittest tests.test_gui_studio -v
