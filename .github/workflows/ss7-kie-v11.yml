name: SS7 KIE V11 benign statistical pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  cached:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: python -m unittest discover -s tests -p 'test_ss7_kie_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46040215219
          pattern: v8-worlds-*
          path: worlds
          merge-multiple: true
      - run: timeout 7m python -m ss7.hierarchical_kie_v11 --stage evaluate --seed 216101 --input worlds --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-development-216101
          path: results/
          if-no-files-found: warn
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: timeout 7m python -m ss7.hierarchical_kie_v11 --stage generate --seed 236101 --shard ${{ matrix.shard }} --out worlds
      - uses: actions/upload-artifact@v4
        with:
          name: v11-worlds-${{ matrix.shard }}
          path: worlds/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  fresh:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 networkx==3.4.2
      - run: python -m unittest discover -s tests -p 'test_ss7_kie_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: v11-worlds-*
          path: worlds
          merge-multiple: true
      - run: timeout 7m python -m ss7.hierarchical_kie_v11 --stage evaluate --seed 236101 --input worlds --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-fresh-236101
          path: results/
          if-no-files-found: warn
