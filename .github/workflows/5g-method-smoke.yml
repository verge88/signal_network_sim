name: 5G prospective workload confirmation
on:
  push:
    branches: ['codex/5g-method-smoke']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  context-confirmation:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [87301, 87302, 87303]
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/live_5g/requirements.txt
      - run: python -m pytest experiments/distributed_5g experiments/accumulation_5g -q
      - name: Retrieve frozen inputs and recorded comparison data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/verge88/signal_network_sim/actions/artifacts/13785795564/zip > measured.zip
          gh api repos/verge88/signal_network_sim/actions/artifacts/13836367435/zip > zonal.zip
          echo 'c76c4ed6a865dc5c37803dbc46e6cd05c62ebe803f398fe409dd2f1090910129  measured.zip' | sha256sum -c
          echo '8aa7e697e674b68b22e9cf7980e653a93f0060ad6469101f651c4c67a6607f0b  zonal.zip' | sha256sum -c
          mkdir public
          unzip -q measured.zip 'frozen/model.joblib' 'frozen/manifest.json' 'frozen/accumulation.json' 'frozen/extensions.json' 'frozen/refinement.json'
          unzip -q zonal.zip zone_models.json
          git rev-parse HEAD > public/source_commit.txt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash experiments/live_5g/setup_open5gs.sh build
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1
      - run: bash experiments/live_5g/setup_open5gs.sh runtime
      - name: Collect 180 fresh normal SBI windows across five network namespaces
        run: bash experiments/distributed_5g/namespace_smoke.sh --seed ${{ matrix.seed }} --out smoke --frozen frozen --zone-models zone_models.json --smoke-windows 180 --include-if-context --confirm-if-context --load-experiment
      - name: Evaluate the frozen rule with labelled offline feature alterations
        run: python -m experiments.distributed_5g.load_trial smoke public
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p public
          sudo journalctl --no-pager -u 'open5gs-*' > public/services.log
          if compgen -G 'smoke/hierarchy/*.log' > /dev/null; then cp smoke/hierarchy/*.log public/; fi
          for file in smoke_report.json manifest.json features.csv labels.csv online_predictions.csv distributed_predictions.jsonl workload_events.jsonl; do
            if test -f "smoke/$file"; then cp "smoke/$file" public/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5g-load-confirmation-${{ matrix.seed }}-${{ github.run_id }}
          path: public/
          retention-days: 30
