name: S5 invariant temporal graph cross-seed screen
# Development-only model/gate selection on archived S5 prospective evidence.

on:
  push:
    branches: ['experiment/temporal-graph-s5-20261112']
    paths:
      - '.github/workflows/temporal-graph-v2-crossseed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cross-seed:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - heldout: 89901
            heldout_artifact: 13967200654
            dev1: 89902
            dev1_artifact: 13966557271
            dev2: 89903
            dev2_artifact: 13966467216
          - heldout: 89902
            heldout_artifact: 13966557271
            dev1: 89901
            dev1_artifact: 13967200654
            dev2: 89903
            dev2_artifact: 13966467216
          - heldout: 89903
            heldout_artifact: 13966467216
            dev1: 89901
            dev1_artifact: 13967200654
            dev2: 89902
            dev2_artifact: 13966557271
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal analysis stack
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2
      - name: Download S5 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in             "${{ matrix.heldout }}:${{ matrix.heldout_artifact }}"             "${{ matrix.dev1 }}:${{ matrix.dev1_artifact }}"             "${{ matrix.dev2 }}:${{ matrix.dev2_artifact }}"; do
            seed="${spec%%:*}"
            artifact="${spec##*:}"
            mkdir -p "packed-${seed}" "evidence-${seed}"
            gh api "repos/verge88/signal_network_sim/actions/artifacts/${artifact}/zip" > "packed-${seed}/artifact.zip"
            unzip -q "packed-${seed}/artifact.zip" -d "packed-${seed}"
            unzip -q "packed-${seed}/full-evidence.zip" -d "evidence-${seed}"
          done
      - name: Run invariant graph cross-seed screen
        run: |
          python -m experiments.distributed_5g.temporal_graph_v2_replay             --heldout "evidence-${{ matrix.heldout }}"             --development "evidence-${{ matrix.dev1 }}" "evidence-${{ matrix.dev2 }}"             --output graph-v2-summary             --seed ${{ matrix.heldout }}
      - uses: actions/upload-artifact@v4
        with:
          name: graph-v2-crossseed-${{ matrix.heldout }}-${{ github.run_id }}
          path: graph-v2-summary/report.json
          retention-days: 30
