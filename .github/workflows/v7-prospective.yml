name: V7 stable-set FPR-constrained prospective confirmation

on:
  push:
    branches: ['experiment/v7-stable-set-fpr-20261114']
    paths:
      - '.github/triggers/v7-prospective'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [90601, 90602, 90603, 90604, 90605, 90606]
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify preregistration is present
        run: |
          cat .github/preregistrations/v7-stable-set-fpr-20261114.txt
          test -f experiments/distributed_5g/temporal_graph_v7.py
          test -f experiments/distributed_5g/v7_design.py
          test -f experiments/distributed_5g/v7_structural_trial.py

      - name: Install experiment stack
        env:
          NO_LONG_DOUBLE: '1'
        run: python -m pip install -r experiments/live_5g/requirements.txt

      - name: Scientific contract tests
        run: python -m pytest experiments/distributed_5g/test_temporal_graph.py -q

      - name: Retrieve hash-pinned non-ML inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/verge88/signal_network_sim/actions/artifacts/13785795564/zip > measured.zip
          gh api repos/verge88/signal_network_sim/actions/artifacts/13836367435/zip > zonal.zip
          echo 'c76c4ed6a865dc5c37803dbc46e6cd05c62ebe803f398fe409dd2f1090910129  measured.zip' | sha256sum -c
          echo '8aa7e697e674b68b22e9cf7980e653a93f0060ad6469101f651c4c67a6607f0b  zonal.zip' | sha256sum -c
          unzip -q measured.zip 'frozen/model.joblib' 'frozen/manifest.json' 'frozen/accumulation.json' 'frozen/extensions.json' 'frozen/refinement.json'
          unzip -q zonal.zip zone_models.json

      - name: Retrieve consumed V4 development and normal references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical development
          download_one() {
            spec="$1"
            seed="${spec%%:*}"
            artifact="${spec##*:}"
            mkdir -p "historical/${seed}" "development/${seed}"
            gh api "repos/verge88/signal_network_sim/actions/artifacts/${artifact}/zip" > "historical/${seed}/artifact.zip"
            unzip -q "historical/${seed}/artifact.zip" -d "historical/${seed}"
            unzip -q "historical/${seed}/full-evidence.zip" \
              'test/features.csv' 'test/labels.csv' \
              'cal/features.csv' 'cal/labels.csv' \
              -d "development/${seed}"
          }
          for spec in \
            "89901:13967200654" "89902:13966557271" "89903:13966467216" \
            "90001:13977466681" "90002:13976814586" "90003:13977925621" \
            "90101:13985819940" "90102:13989515036" "90103:13988990036"; do
            download_one "$spec" &
          done
          wait

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1

      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash experiments/live_5g/setup_open5gs.sh build

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: open5gs-2.7.6.tar.gz
          key: open5gs-d9d3abdd-ubuntu22-build-v1

      - run: bash experiments/live_5g/setup_open5gs.sh runtime

      - name: Collect fresh normal train and calibration
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
          cp zone_models.json evidence/zone_models.json
          python -m experiments.live_5g.collect \
            --phase train --seed $(( ${{ matrix.seed }} + 1000 )) \
            --out evidence/train --windows 600 --actors 32
          python -m experiments.live_5g.collect \
            --phase cal --seed $(( ${{ matrix.seed }} + 2000 )) \
            --out evidence/cal --windows 600 --actors 32

      - name: Freeze V7 before held-out structural traffic
        run: |
          python -m experiments.distributed_5g.full_experiment prepare evidence \
            --previous frozen --seed ${{ matrix.seed }} --detector temporal_graph_v7 \
            --development \
              development/89901/test development/89902/test development/89903/test \
              development/90001/test development/90002/test development/90003/test \
              development/90101/test development/90102/test development/90103/test \
            --reference-calibration \
              development/89901/cal development/89902/cal development/89903/cal \
              development/90001/cal development/90002/cal development/90003/cal \
              development/90101/cal development/90102/cal development/90103/cal \
            --v4-cluster-order 2 --v4-decay 0.75 --v4-alpha 0.00015 \
            --v4-accumulator-multiplier 1.50
          cp evidence/frozen/manifest.json evidence/frozen_manifest_before_test.json

      - name: Run fresh held-out randomized variable-k schedule
        run: |
          bash experiments/distributed_5g/namespace_smoke.sh \
            --seed ${{ matrix.seed }} --out evidence/test --frozen evidence/frozen \
            --zone-models evidence/zone_models.json --include-if-context --confirm-if-context \
            --ml-method TG_V7 --ml-confirmation-mode direct \
            --accumulator-multiplier 1.50 --recover-normal \
            --v7-structure-experiment

      - name: Audit V7 prospective structural evidence
        run: |
          python -m experiments.distributed_5g.v7_structural_trial audit \
            evidence evidence/v7-summary

      - name: Collect reproducibility evidence
        if: always()
        run: |
          mkdir -p evidence/v7-summary
          sudo journalctl --no-pager -u 'open5gs-*' > evidence/v7-summary/services.log
          cp evidence/source_commit.txt evidence/v7-summary/ || true
          cp .github/preregistrations/v7-stable-set-fpr-20261114.txt evidence/v7-summary/preregistration.txt || true
          cp evidence/frozen/manifest.json evidence/v7-summary/model_manifest.json || true
          cp evidence/frozen_manifest_before_test.json evidence/v7-summary/ || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('evidence')
          with zipfile.ZipFile('v7-full-evidence.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in root.rglob('*'):
                  if p.is_file() and 'hierarchy' not in p.parts:
                      archive.write(p,p.relative_to(root))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-structural-summary-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence/v7-summary/
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-structural-evidence-${{ matrix.seed }}-${{ github.run_id }}
          path: v7-full-evidence.zip
          retention-days: 90

  aggregate:
    needs: prospective
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - uses: actions/download-artifact@v4
        with:
          pattern: v7-structural-summary-*
          path: v7-inputs
      - name: Aggregate preregistered V7 statistics
        run: |
          python -m experiments.distributed_5g.v7_structural_trial aggregate \
            v7-inputs v7-confirmation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-structural-confirmation-${{ github.run_id }}
          path: v7-confirmation/
          retention-days: 90
