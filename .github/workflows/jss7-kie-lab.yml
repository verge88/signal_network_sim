name: jSS7 KIE protocol-stack smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/jss7-kie-lab.yml'
      - 'experiments/jss7_kie/**'
      - 'tests/test_jss7_kie.py'
  push:
    paths:
      - '.github/workflows/jss7-kie-lab.yml'
      - 'experiments/jss7_kie/**'
      - 'tests/test_jss7_kie.py'

permissions:
  contents: read

concurrency:
  group: jss7-kie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-lab:
    name: MAP and KIE (${{ matrix.topology }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        topology: [direct, osmostp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: experiments/jss7_kie/pom.xml
      - name: Test evidence and failure handling
        run: python -m unittest discover -s tests -p test_jss7_kie.py -v
      - name: Install capture tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsctp1 lksctp-tools tcpdump tshark
          sudo modprobe sctp || true
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_SCTP):
              print('SCTP socket available')
          PY
      - name: Install OsmoSTP router
        if: matrix.topology == 'osmostp'
        run: |
          sudo apt-get install -y --no-install-recommends osmo-stp=1.6.0+dfsg1-3.1build2
          # Stop the package's default daemon on this disposable runner.
          # The lab starts and owns one router with its static configuration.
          sudo systemctl stop osmo-stp.service
      - name: Build pinned jSS7 adapter
        run: |
          mvn -B -ntp -f experiments/jss7_kie/pom.xml package
      - name: Run real protocol exchange and KIE verification
        run: |
          python -m experiments.jss7_kie.run_lab --out runs/jss7-kie --repetitions 2 --topology ${{ matrix.topology }}
      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('runs/jss7-kie/summary.json')
          print('## jSS7 KIE smoke test')
          if p.exists():
              s = json.loads(p.read_text())
              print('```json\n' + json.dumps(s, indent=2) + '\n```')
          else:
              print('No experiment result: setup/build failed or execution was interrupted.')
          print('This checks real MAP peers and side-channel KIE consistency, not operational detection accuracy.')
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jss7-kie-${{ matrix.topology }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/jss7-kie/
          if-no-files-found: warn
          retention-days: 30
