! Two static ASPs: client PC=1/RC=101, server PC=2/RC=102.
log stderr
 logging filter all 1
 logging color 0
 logging timestamp 1
 logging level set-all notice
line vty
 no login
 bind 127.0.0.1
cs7 instance 0
 point-code 0.0.0
 asp jss7-client 2345 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
 asp jss7-server 3434 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
 as client m3ua
  asp jss7-client
  traffic-mode loadshare
  routing-key 101 0.0.1
 as server m3ua
  asp jss7-server
  traffic-mode loadshare
  routing-key 102 0.0.2
 route-table system
  update route 0.0.1 7.255.7 linkset client
  update route 0.0.2 7.255.7 linkset server
 listen m3ua 2905
  local-ip 127.0.0.1
